apiVersion: apps/v1
kind: Deployment
metadata:
  name: pneumodetect-api
  namespace: pneumodetect
  labels:
    app: pneumodetect-api
    version: "1.0.0"
    component: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pneumodetect-api
  strategy:
    type: RollingUpdate         # Zero-downtime deployment
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pneumodetect-api
        version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/thriniiiiiiiiiiii/pneumodetect-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pneumodetect-secrets
                  key: hf-token
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pneumodetect-api-hpa
  namespace: pneumodetect
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pneumodetect-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
