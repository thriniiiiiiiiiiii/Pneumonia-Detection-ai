name: Deploy — Push to Registry & Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

jobs:
  # ── Job 1: Publish Docker Image ─────────────────────────────────────────────
  publish:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pneumodetect-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: GitHub Release ───────────────────────────────────────────────────
  release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD \
            --pretty=format:"- %s (%h)" > CHANGELOG_BODY.md
          cat CHANGELOG_BODY.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          bodyFile: CHANGELOG_BODY.md
          generateReleaseNotes: true
          makeLatest: true

  # ── Job 3: Smoke Test Production ────────────────────────────────────────────
  smoke:
    name: 💨 Smoke Test Production
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Health check — Production API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            https://pneumodetect-api.onrender.com/health)
          if [ "$response" != "200" ]; then
            echo "❌ Production health check failed: HTTP $response"
            exit 1
          fi
          echo "✅ Production API healthy: HTTP $response"

      - name: Health check — Streamlit App
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            https://pneumodetectai.streamlit.app)
          echo "Streamlit response code: $response"
